plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.maxivcapture'

base {
    archivesName = 'maxivcaptureneo'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://artifacts.impactdev.net/repository/development/' }
    maven { url = 'https://maven.impactdev.net/repository/development/' }
    mavenCentral()
}

neoForge {
    version = project.neo_version
}

dependencies {
    compileOnly "com.cobblemon:neoforge:${project.cobblemon_version}"
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}

// Your repo keeps all files in one flat folder, so tell Gradle where each file is.
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes('FMLModType': 'MOD')
    }
    from('.') {
        include 'neoforge.mods.toml'
        into 'META-INF'
    }
}
